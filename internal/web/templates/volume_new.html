{{define "content"}}
{{$f := .Data.Form}}
<div class="page-head">
  <div class="title-row">{{template "back_button" "/volumes"}}<h1>Create Volume</h1></div>
</div>
<section class="panel">
  <form method="post" action="/volumes" class="stack">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    {{if .Data.Err}}<div class="flash error" role="alert">{{.Data.Err}}</div>{{end}}
    <div class="fields">
      <label class="field">
        <span class="field-label">Name <span class="opt">optional</span></span>
        <input name="name" value="{{$f.Name}}" placeholder="data" pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]*" autocomplete="off" spellcheck="false">
        <small class="hint">Generated if empty (anonymous volume).</small>
      </label>
      <label class="field">
        <span class="field-label">Driver</span>
        <select name="driver">
          <option value="">Default</option>
          {{range .Data.Drivers}}<option value="{{.}}" {{if eq . $f.Driver}}selected{{end}}>{{.}}</option>{{end}}
        </select>
        {{with .Data.Drivers}}<small class="hint">The runtime's default is <code>{{index . 0}}</code>.</small>{{end}}
      </label>
    </div>
    <div class="fields">
      <label class="field">
        <span class="field-label">Type <span class="opt flag">--opt type</span></span>
        <input name="opt_type" value="{{$f.Type}}" placeholder="nfs" autocomplete="off" spellcheck="false">
        <small class="hint">Filesystem type, e.g. <code>nfs</code>, <code>cifs</code>, <code>tmpfs</code>, <code>none</code></small>
      </label>
      <label class="field">
        <span class="field-label">Device <span class="opt flag">--opt device</span></span>
        <input name="opt_device" value="{{$f.Device}}" placeholder=":/export/data" autocomplete="off" spellcheck="false">
        <small class="hint">Device or remote path to mount</small>
      </label>
      <label class="field">
        <span class="field-label">Mount options <span class="opt flag">--opt o</span></span>
        <input name="opt_o" value="{{$f.O}}" placeholder="addr=10.0.0.1,rw" autocomplete="off" spellcheck="false">
        <small class="hint">Comma-separated, e.g. <code>addr=10.0.0.1,rw</code></small>
      </label>
    </div>
    {{/* Inputs inside a closed <details> are still submitted. */}}
    <details class="section advanced"{{if $f.AdvancedChanged}} open{{end}}>
      <summary>
        <span class="summary-title">Options &amp; Labels</span>
        <span class="summary-sub">Driver-specific options and metadata</span>
      </summary>
      <div class="advanced-body">
        <div class="fields">
          <label class="field">
            <span class="field-label">Additional driver options <span class="opt flag">--opt</span></span>
            <textarea name="options" rows="3" placeholder="key=value" spellcheck="false">{{$f.Options}}</textarea>
            <small class="hint">One per line: <code>key=value</code></small>
          </label>
          <label class="field">
            <span class="field-label">Labels <span class="opt flag">--label</span></span>
            <textarea name="labels" rows="3" placeholder="app=web" spellcheck="false">{{$f.Labels}}</textarea>
            <small class="hint">One per line: <code>key=value</code></small>
          </label>
        </div>
      </div>
    </details>
    <div><button type="submit" class="primary">Create volume</button></div>
  </form>
</section>
{{end}}
