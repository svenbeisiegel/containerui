{{define "content"}}
{{$d := .Data.Detail}}
<div class="page-head">
  <div class="title-row">{{template "back_button" "/compose"}}<h1 class="wrap">{{$d.Project.Name}}</h1></div>
  {{if not $d.Err}}{{template "compose_actions" (dict "P" $d.Project "View" "detail" "CSRF" $d.CSRF)}}{{end}}
</div>
{{if $d.Err}}<div class="flash error">{{$d.Err}}</div>
{{else}}
{{template "compose_project" $d}}
{{end}}
{{end}}
