{{define "head"}}<script src="/static/drawer.js" defer></script>{{end}}
{{define "content"}}
{{$d := .Data.Detail}}
<div class="page-head">
  <div>
    <a class="back" href="/compose">← Compose</a>
    <h1 class="wrap">{{$d.Project.Name}}</h1>
  </div>
</div>
{{if $d.Err}}<div class="flash error">{{$d.Err}}</div>
{{else}}
{{template "compose_project" $d}}
{{template "compose_output" .Data.Output}}
{{end}}
{{end}}
