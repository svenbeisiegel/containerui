# ContainerUI configuration. Every setting is optional: anything left out
# uses the default shown here.

server:
  # Address to listen on. 0.0.0.0 serves every interface (sign-in is always
  # required; keep TLS enabled). Use 127.0.0.1 to allow local access only.
  listen: "0.0.0.0:8443"
  tls:
    enabled: true
    # Generate a self-signed certificate on first start
    # (containerui-cert.pem / containerui-key.pem next to this file).
    self_signed: true
    # Or point to your own certificate (relative paths are resolved
    # against this file's directory) and set self_signed: false.
    cert_file: ""
    key_file: ""
  session_idle_timeout: 30m
  session_absolute_timeout: 12h
  # Linux only: PAM service used to check system passwords.
  pam_service: login
  # Windows: let Windows accounts sign in (local or domain, as user,
  # DOMAIN\user or user@domain) when they may use the container runtime,
  # i.e. its named pipe (members of docker-users or Administrators for
  # Docker). The users below sign in either way. Linux always signs in
  # with system accounts.
  system_accounts: true

runtime:
  # Container runtime: auto, wslc, docker, podman or fake (in-memory demo
  # data). auto picks the first one that is installed and answers
  # (Windows: wslc, docker, podman; Linux: docker, podman).
  driver: auto
  path: ""                # CLI binary; empty = wslc.exe / docker / podman on PATH
  session: ""             # wslc only; empty = the CLI's default session
  # docker/podman: the daemon's Unix socket (/path or unix:///path). Empty =
  # $DOCKER_HOST, then /var/run/docker.sock (rootful podman:
  # /run/podman/podman.sock). The CLI, the resource monitoring (which reads
  # the API through it, falling back to the CLI) and the Linux sign-in check
  # use it.
  socket: ""
  command_timeout: 30s    # list/start/stop/... calls
  pull_timeout: 30m       # image pulls and container create
  # Compose (docker/podman only; wslc has no compose). Empty = use the
  # runtime's plugin ("docker compose" / "podman compose"), then
  # docker-compose / podman-compose on PATH.
  compose_path: ""
  compose_timeout: 30m    # compose up/down/pull
  compose_dir: compose    # deployed compose files, one folder per project
  # Volume backup and restore (docker/podman) run a short-lived container
  # of this image that mounts the volume and reads or writes its content
  # with tar; it is pulled when missing. It needs sh, tar and find.
  volume_helper_image: docker.io/library/busybox:stable
  # Uploaded backups wait here until they are restored (at most 24 hours).
  # Empty = volume-uploads next to the compose folder.
  volume_upload_dir: ""

# Linux: the errors of the systemd journal (priority err and worse) are
# kept for 7 days and shown on the Events page, one JSON Lines file per
# day, which grep and jq can search (relative to this file).
events:
  dir: events

# The activity side bar keeps the newest 100 actions done through the UI
# (pulls, compose, container, image, volume and network actions) in this
# file, so they are still listed after a restart. Empty = activity.json in
# the folder that holds compose_dir.
activity:
  file: ""

# Every check_interval, the registries of all local images are asked
# whether a newer image is available: the same tag rebuilt, or higher
# version tags (1.27 -> 1.28). The Images page can also check right away.
# Logins come from the runtime's auth file (docker login / podman login of
# the account ContainerUI runs as); credential helpers are not supported.
registry:
  check_updates: true
  check_interval: 30m     # how often all local images are checked
  timeout: 10s            # per registry request
  auth_file: ""           # empty = podman auth.json, then ~/.docker/config.json
  insecure_registries: [] # host:port of registries reached over plain HTTP

# Resource monitoring (docker/podman). CPU, RAM and disk I/O of the running
# containers are sampled in the background, every dashboard_interval while
# the dashboard is shown; the dashboard charts the last 15 minutes. Disk
# usage (images, containers, volumes and the host folders containers
# bind-mount) is measured every disk_interval and when the dashboard is
# opened. Nothing is written to disk.
metrics:
  interval: 1m            # at least 10s
  dashboard_interval: 10s # at least 2s, at most interval
  disk_interval: 1h       # at least 5m

# Windows: additional sign-in accounts. When the list is empty and
# system_accounts is false, ContainerUI asks for a username and password on
# its first start and adds the account here.
# Linux: ignored; users sign in with their system account (PAM) and must be
# allowed to use the container runtime (e.g. member of the docker group).
users: []
  # - username: admin
  #   # Generate with: containerui hash-password
  #   password_hash: "$2a$12$..."
  # A plaintext password is accepted too, but logs a warning at startup:
  # - username: dev
  #   password: change-me
