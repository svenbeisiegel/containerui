name: Release

# Manually started only: a release is a deliberate act.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # nfpm signs the rpms with the key, written armored as it reads it; the
      # repo job signs the repositories. First, so a bad key commits nothing.
      - name: signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          bash packaging/repo/import-key.sh "$RUNNER_TEMP/signing.asc"
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/signing.asc" >> "$GITHUB_ENV"

      # The released version is committed, so the code matches the release.
      - name: bump VERSION
        run: |
          echo -n "${{ inputs.version }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- VERSION; then
            echo "VERSION is already ${{ inputs.version }}"
          else
            git add VERSION
            git commit -m "Release ${{ inputs.version }}"
            git push
          fi

      - name: vet and test
        run: make lint race

      # the rpm and deb packages into dist, and what the msi job builds the
      # Windows installers from into build/pkg
      - name: make packages
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          make packages VERSION=${{ inputs.version }}
          rm -f "$SIGNING_KEY_FILE"

      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: dist/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: msi-inputs
          path: |
            build/pkg/containerui_windows_*.exe
            build/pkg/config.windows.yaml
          if-no-files-found: error

  # The WiX Toolset builds an msi on Windows alone. Version 5 is the last one
  # under the MS-RL without the Open Source Maintenance Fee of 6 and later; it
  # is built for .NET 6, hence the roll forward to the .NET the runner has.
  msi:
    needs: linux
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: Major
      WIX_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: msi-inputs
          path: build/pkg

      - name: install the WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add --global WixToolset.Util.wixext/$env:WIX_VERSION
          wix extension add --global WixToolset.Firewall.wixext/$env:WIX_VERSION
          wix extension add --global WixToolset.UI.wixext/$env:WIX_VERSION

      # Code signing goes here once there is a certificate (e.g. Azure Trusted
      # Signing): sign build/pkg/containerui_windows_*.exe before the msi is
      # built, and the .msi files after.

      - name: build the msi files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($pair in @(@("x64", "amd64"), @("arm64", "arm64"))) {
            $arch, $goarch = $pair
            wix build packaging/windows/containerui.wxs -arch $arch `
              -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext -ext WixToolset.UI.wixext `
              -d Version=${{ inputs.version }} `
              -d Bin="$PWD\build\pkg\containerui_windows_$goarch.exe" `
              -d Config="$PWD\build\pkg\config.windows.yaml" `
              -d License="$PWD\LICENSE" `
              -d Notices="$PWD\THIRD_PARTY_NOTICES.md" `
              -o dist/containerui-${{ inputs.version }}-$arch.msi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  publish:
    needs: [linux, msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rpm
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: msi
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: dist

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: dist/*

  # The zypper/dnf and apt repositories on GitHub Pages, rebuilt from the
  # packages of the five newest releases, so older versions drop out. Pages
  # must be set to deploy from GitHub Actions.
  repo:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: install createrepo_c
        run: sudo apt-get update && sudo apt-get install -y createrepo-c

      - name: import the signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: bash packaging/repo/import-key.sh

      - name: build the repositories
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          KEEP: 5
        run: bash packaging/repo/build.sh site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
